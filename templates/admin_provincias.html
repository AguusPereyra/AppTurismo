
<!DOCTYPE html>

<html>

<head>

    <title>

        Gestionar Provincias

    </title>

    <style>

        body {

            margin: 0;

            padding: 40px;

            font-family: Arial, sans-serif;

            background-color: #0f172a;

            color: #f8fafc;

        }

        h1 {

            margin-bottom: 40px;

        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 25px;

        }

        .card {

            background-color: #1e293b;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.3
                );

            text-align: center;

            transition: 0.3s;

        }

        .card:hover {

            transform: translateY(-5px);

        }

        .card h2 {

            color: #60a5fa;

            margin-top: 0;

        }

        .card p {

            color: #94a3b8;

        }

        .boton {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 20px;

            background-color: #3b82f6;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

        }

        .boton:hover {

            background-color: #2563eb;

        }

        .volver {

            display: inline-block;

            margin-top: 40px;

            color: #94a3b8;

            text-decoration: none;

        }

    </style>

</head>

<body>

    <h1>

        🗺️ Gestionar Provincias

    </h1>

    <div class="grid">

        {% for provincia in provincias %}

            <div class="card">

                <h2>

                    {{ provincia[1] }}

                </h2>

                <p>

                    {{ provincia[2] }}

                </p>

                <a
                    class="boton"
                    href="{{ url_for(
                        'auth.editar_provincias',
                        provincia_id=provincia[0]
                    ) }}"
                >

                    Editar

                </a>

            </div>

        {% endfor %}

    </div>

    <a
        class="volver"
        href="{{ url_for('auth.admin') }}"
    >

        ← Volver al panel

    </a>

</body>

</html>
