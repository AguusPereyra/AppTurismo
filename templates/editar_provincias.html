<!DOCTYPE html>
<html>
<head>
    <style>

        body {

            margin: 0;

            padding: 40px;

            font-family: Arial, sans-serif;

            background-color: #0f172a;

            color: #f8fafc;

        }

        .contenedor {

            max-width: 900px;

            margin: auto;

            background-color: #1e293b;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(
                    0,
                    0,
                    0,
                    0.3
                );

        }

        h1 {

            margin-top: 0;

            color: #60a5fa;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #cbd5e1;

        }

        input,
        textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 10px;

            border: 1px solid #334155;

            background-color: #0f172a;

            color: #f8fafc;

        }

        input:focus,
        textarea:focus {

            outline: none;

            border-color: #3b82f6;

        }

        img {

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.3
                );

            margin-bottom: 20px;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background-color: #3b82f6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover {

            background-color: #2563eb;

        }

        .volver {

            display: inline-block;

            margin-top: 30px;

            color: #94a3b8;

            text-decoration: none;

        }

        .volver:hover {

            color: #f8fafc;

        }

    </style>


    <title>
        Editar Provincia
    </title>

</head>

<body>
    <div class="contenedor">
        <h1>
            Editar {{ provincia[1] }}
        </h1>    

        <form method="POST" enctype="multipart/form-data">

            <label>
                Imagen actual
            </label>

            <br>

            <img
                src="{{ url_for('static', filename='img/provincias/' + provincia[2]) }}"
                width="250"
            >

            <br><br>

            <label>
                Cambiar imagen
            </label>

            <br>

            <input type="file" name="imagen" accept="image/*">

            <br><br>

            <label>
                Descripción
            </label>

            <br>

            <textarea name="descripcion" rows="5" cols="60">{{ provincia[3] }}</textarea>

            <br><br>

            <label>
                Capital
            </label>

            <br>

            <input type="text" name="capital" value="{{ provincia[4] }}">

            <br><br>

            <label>
                Población
            </label>

            <br>

            <input type="text" name="poblacion" value="{{ provincia[5] }}">

            <br><br>

            <label>
                Superficie
            </label>

            <br>

            <input type="text" name="superficie" value="{{ provincia[6] }}">

            <br><br>

            <label>
                Región
            </label>

            <br>

            <input type="text" name="region" value="{{ provincia[7] }}">

            <br><br>

            <label>
                Dato curioso
            </label>

            <br>

            <textarea name="dato_curioso" rows="4" cols="60">{{ provincia[8] }}</textarea>

            <br><br>

            

            <button type="submit">
                Guardar cambios
            </button>
        </form>
    <div/> 

    <br>

    <a class="volver" href="{{ url_for('auth.admin_provincias') }}" > ← Volver a Provincias </a>

</body>

</html>
